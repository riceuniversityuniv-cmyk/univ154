function calcStateTax(gross, name) {
  const s=STATE_TAX[name]; if(!s) return 0;
  const taxable=Math.max(0, gross-(s.std||0)-(s.personal||0));
  let tax=0, prev=0;
  for(const [top,r] of s.brackets){if(taxable<=prev)break; tax+=(Math.min(taxable,top)-prev)*r; prev=top;}
  return tax;
}
function calcCityTax(gross, city) {
  if(!city) return 0;
  const c=CITY_TAX[city]; if(!c) return 0;
  if(c.flat) return gross*c.flat;
  let tax=0,prev=0;
  for(const [top,r] of c.brackets){if(gross<=prev)break; tax+=(Math.min(gross,top)-prev)*r; prev=top;}
  return tax;
}

  const {housing:hm, general:gm} = getMultipliers(form.retireState, form.retireCity);

  const carT = form.carType==="lease"?TIERS.carLease:TIERS.carOwn;
  form.housingAmt = hBase>0?r5(hBase*hm):0;
  form.homeCareAmt = TIERS.homeCare[form.homeCareTier]?.base??0;
  form.foodAmt = r5((TIERS.food[form.foodTier]?.base||0)*gm);
  form.fitnessAmt = r5((TIERS.fitness[form.fitnessTier]?.base||0)*gm);
  form.lifestyleAmt = r5((TIERS.lifestyle[form.lifestyleTier]?.base||0)*gm);
  form.clothingAmt = r5((TIERS.clothing[form.clothingTier]?.base||0)*gm);
  form.personalCareAmt = r5((TIERS.personalCare[form.personalCareTier]?.base||0)*gm);
  form.petsAmt = TIERS.pets[form.petsTier]?.base??0;
  form.carAmt = carT[form.carTier]?.base??0;
  form.therapyAmt = TIERS.therapy[form.therapyTier]?.base??0;
  form.vacationAmt = TIERS.vacation[form.vacationTier]?.base??0;
  form.streamAmt = TIERS.streaming[form.streamTier]?.base??0;
  form.giftsAmt = TIERS.gifts[form.giftsTier]?.base??0;
}

function calcResults() {
  const base = {housing:parseFloat(form.housingAmt)||0,homeCare:parseFloat(form.homeCareAmt)||0,car:parseFloat(form.carAmt)||0,food:parseFloat(form.foodAmt)||0,healthcare:parseFloat(form.healthcareAmt)||0,fitness:parseFloat(form.fitnessAmt)||0,therapy:parseFloat(form.therapyAmt)||0,lifestyle:parseFloat(form.lifestyleAmt)||0,vacation:parseFloat(form.vacationAmt)||0,streaming:parseFloat(form.streamAmt)||0,gifts:parseFloat(form.giftsAmt)||0,clothing:parseFloat(form.clothingAmt)||0,personalCare:parseFloat(form.personalCareAmt)||0,pets:parseFloat(form.petsAmt)||0};
  const mo = {...base};
  if(hasSpouse()){for(const [key,pctA] of Object.entries(SPOUSE_ADDERS)){if(mo[key]!==undefined)mo[key]=Math.round(mo[key]*(1+pctA));}}
  const nc = numChildren();
  if(nc>0){for(const [key,flatA] of Object.entries(CHILD_ADDERS)){if(mo[key]!==undefined)mo[key]+=flatA*nc;}}
  const annual = Object.values(mo).reduce((a,b)=>a+b,0)*12;
  const cPct = TIERS.charity[form.charityTier].pct||0;
  const f = filing();
  let gross = annual*1.5;
  for(let i=0;i<20;i++){const fed=calcFederalTax(gross,f),st=calcStateTax(gross,form.retireState),ct=calcCityTax(gross,form.retireCity),ch=gross*cPct;gross=annual+fed+st+ct+ch;}
  gross = Math.ceil(gross/500)*500;
  const fedTax=calcFederalTax(gross,f),stateTax=calcStateTax(gross,form.retireState),cityTax=calcCityTax(gross,form.retireCity),charity=gross*cPct;
  return {gross,fedTax,stateTax,cityTax,charity,takeHome:gross-fedTax-stateTax-cityTax-charity,mo,base,cPct};
}

// ── HTML Helpers ──
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function pillHtml(text) {

}

function noteHtml(content, type="blue") {
  const map = {blue:{bg:C.navyPale,bdr:C.navyBdr,txt:C.navy,icon:"\u2139"},amber:{bg:C.amberPale,bdr:C.amberBdr,txt:C.amber,icon:"\u26A0"},green:{bg:C.greenPale,bdr:C.greenBdr,txt:C.green,icon:"\u2713"}};

}

function labelHtml(text) {
  return `<div style="font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:${C.sub};margin-bottom:8px">${text}</div>`;

function inputHtml(fieldKey, placeholder="0", dollar=true) {
  const val = form[fieldKey] !== undefined && form[fieldKey] !== "" ? form[fieldKey] : "";
  return `<div style="position:relative">${dollar?`<span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:${C.faint};font-size:14px;pointer-events:none">$</span>`:''}<input type="number" value="${esc(String(val))}" placeholder="${esc(placeholder)}" data-field="${esc(fieldKey)}" style="width:100%;box-sizing:border-box;background:${C.white};border:1.5px solid ${C.border};border-radius:8px;color:${C.ink};font-size:14px;padding:${dollar?'11px 13px 11px 28px':'11px 13px'};outline:none;font-weight:400;transition:border-color .18s"/></div>`;

function selectHtml(fieldKey, options) {
  let html = `<div style="position:relative"><select data-field="${esc(fieldKey)}" style="width:100%;box-sizing:border-box;appearance:none;background:${C.white};border:1.5px solid ${C.border};border-radius:8px;color:${C.ink};font-size:14px;padding:11px 36px 11px 13px;outline:none;font-weight:400;cursor:pointer;transition:border-color .18s">`;
  for (const opt of options) {
    html += `<option value="${esc(opt.value)}"${form[fieldKey]===opt.value?' selected':''}>${esc(opt.label)}</option>`;
  }
  html += `</select><span style="position:absolute;right:13px;top:50%;transform:translateY(-50%);pointer-events:none;color:${C.muted};font-size:12px">\u25BE</span></div>`;

function hintHtml(text) {
  return `<div style="font-size:11px;color:${C.faint};margin-top:5px;line-height:1.5">${text}</div>`;

function tierBtnHtml(tierKey, fieldKey, t, selected, hint, cols) {
  return `<div data-tier="${esc(tierKey)}" data-tierfield="${esc(fieldKey)}" style="border:2px solid ${selected?C.navyMd:C.border};background:${selected?C.navyPale:C.white};border-radius:10px;padding:13px 14px;cursor:pointer;transition:all .15s;box-shadow:${selected?`0 0 0 3px ${C.navyBdr}`:'none'}"><div style="font-size:13px;font-weight:600;color:${selected?C.navy:C.ink};margin-bottom:2px">${esc(t.label)}</div><div style="font-size:11px;color:${C.sub};line-height:1.4">${esc(t.sub)}</div>${t.eg?`<div style="font-size:10px;color:${selected?C.navyLt:C.faint};font-style:italic;margin-top:4px;line-height:1.35">${esc(t.eg)}</div>`:''}${hint?`<div style="font-size:11px;font-weight:600;color:${selected?C.navyMd:C.muted};margin-top:6px">${esc(hint)}</div>`:''}</div>`;

function tierGridHtml(tiersObj, fieldKey, cols, mult) {
  mult = mult || 1.0;
  const entries = Object.entries(tiersObj);
  const actualCols = Math.min(cols||4, entries.length);
  let html = `<div style="display:grid;grid-template-columns:repeat(${actualCols},1fr);gap:10px;margin-bottom:14px">`;
  for (const [k,t] of entries) {
    const adjustedBase = t.base!==undefined&&t.base>0?r5(t.base*mult):t.base;
    const hint = adjustedBase!==undefined&&adjustedBase>0?`~${fmt(adjustedBase)}/mo`:adjustedBase===0?"Free":t.pct!=null?`${(t.pct*100).toFixed(0)}% of income`:undefined;
    html += tierBtnHtml(k, fieldKey, t, form[fieldKey]===k, hint, actualCols);
  }
  html += '</div>';
  return html;
}

function housingTierGridHtml() {
  const tierSet = form.housingType==="own"?TIERS.housingOwn:TIERS.housingRent;
  const mults = getMultipliers(form.retireState, form.retireCity);
  let html = `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px">`;
  for (const [k,t] of Object.entries(tierSet)) {
    const eb = getHousingBase(k, form.housingType, form.mortgagePaidOff);
    const adj = eb>0?r5(eb*mults.housing):0;
    const hint = adj>0?`~${fmt(adj)}/mo`:"Free";
    html += tierBtnHtml(k, "housingTier", t, form.housingTier===k, hint, 2);
  }
  html += '</div>';
  return html;
}

    + `<p style="font-size:14px;color:${C.sub};margin:0 0 20px;line-height:1.75">Clothing, haircuts, skincare, and grooming.${sp?" Per-person \u2014 spouse amounts added automatically.":""}</p>`;
  if (form.retireState) html += noteHtml(`Costs adjusted for <strong>${esc(form.retireState)}</strong> cost of living.`, "blue");
  html += `<div style="margin-bottom:26px">${labelHtml("Clothing & Fashion")}`
    + tierGridHtml(TIERS.clothing, "clothingTier", 2, mults.general)
    + inputHtml("clothingAmt")
    + hintHtml("Wardrobe updates, shoes, seasonal shopping, dry cleaning")
    + '</div><div>'
    + labelHtml("Personal Care & Grooming")
    + tierGridHtml(TIERS.personalCare, "personalCareTier", 2, mults.general)
    + inputHtml("personalCareAmt")
    + hintHtml("Haircuts, skincare, spa visits, grooming products, cosmetics")
    + '</div>';
  return html;
}

function renderStep11() {
  return pillHtml("Technology & Subscriptions")
    + `<h2 style="font-size:24px;font-weight:700;color:${C.ink};margin:0 0 20px">Tech, streaming & subscriptions</h2>`
    + `<div style="margin-bottom:26px">${labelHtml("Phone, Internet, Streaming & Software")}`
    + tierGridHtml(TIERS.streaming, "streamTier", 2, 1.0)
    + inputHtml("streamAmt")
    + hintHtml("Phone bill, home internet, streaming, software, cloud storage, device upgrades")
    + '</div><div>'
    + labelHtml("Gifts (Birthdays, Holidays, Weddings)")
    + tierGridHtml(TIERS.gifts, "giftsTier", 3, 1.0)
    + inputHtml("giftsAmt")
    + '</div>';
}

function renderStep12() {
  return pillHtml("Charitable Giving")
    + `<h2 style="font-size:24px;font-weight:700;color:${C.ink};margin:0 0 10px">Giving back</h2>`
    + `<p style="font-size:14px;color:${C.sub};margin:0 0 22px;line-height:1.75">Calculated as a percentage of your gross income.</p>`
    + labelHtml("Charitable Giving")
    + tierGridHtml(TIERS.charity, "charityTier", 4, 1.0);
}

function renderResults() {
  const r = calcResults();
  const sp = hasSpouse();
  const nc = numChildren();
  const f = filing();
  const cats = [
    {l:"Housing",v:r.mo.housing},{l:"Home Care",v:r.mo.homeCare},{l:"Transportation",v:r.mo.car},
    {l:"Food & Dining",v:r.mo.food},{l:"Healthcare",v:r.mo.healthcare},{l:"Fitness",v:r.mo.fitness},
    {l:"Therapy",v:r.mo.therapy},{l:"Lifestyle",v:r.mo.lifestyle},{l:"Travel",v:r.mo.vacation},
    {l:"Pets",v:r.mo.pets},{l:"Clothing",v:r.mo.clothing},{l:"Personal Care",v:r.mo.personalCare},{l:"Technology",v:r.mo.streaming},
    {l:"Gifts",v:r.mo.gifts},
  ].filter(x=>x.v>0).map((x,i)=>({...x,color:BAR_COLORS[i%BAR_COLORS.length]}));
  const totalMo = cats.reduce((s,x)=>s+x.v,0);
  const taxPct = r.gross>0?((r.fedTax+r.stateTax+r.cityTax)/r.gross*100).toFixed(1):"0.0";

  let html = pillHtml("Your Results");

  // Hero
  html += `<div style="background:linear-gradient(135deg,${C.navyDk} 0%,${C.navy} 55%,${C.navyMd} 100%);border-radius:14px;padding:26px 28px;margin-bottom:22px;box-shadow:0 6px 24px rgba(20,31,82,.25)">`;
  html += `<div style="font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:6px">${form.name?esc(form.name)+"'s "+incomeLabel():incomeLabel()}</div>`;
  html += `<div style="font-size:56px;font-weight:800;color:${C.white};letter-spacing:-2px;line-height:1">${fmt(r.gross)}</div>`;
  html += `<div style="font-size:13px;color:rgba(255,255,255,.5);margin-top:6px">gross annual \u00B7 ${esc(householdLabel())} \u00B7 ${esc(form.retireCity||form.retireState)}</div>`;
  html += `<div style="display:flex;gap:0;margin-top:20px;border-top:1px solid rgba(255,255,255,.12);padding-top:18px">`;
  const heroItems = [{label:"Gross / Month",val:fmt(r.gross/12)},{label:"Take-Home / Month",val:fmt(r.takeHome/12)},{label:"Total Tax Rate",val:taxPct+"%"},{label:"After-Tax / Year",val:fmt(r.takeHome)}];
  heroItems.forEach((item,i)=>{
    html += `<div style="flex:1;text-align:center;${i>0?'border-left:1px solid rgba(255,255,255,.12);':''}padding:0 8px"><div style="font-size:17px;font-weight:700;color:${C.gold}">${esc(item.val)}</div><div style="font-size:10px;color:rgba(255,255,255,.45);margin-top:3px">${esc(item.label)}</div></div>`;
  });
  html += '</div></div>';

  // Household note
  if (form.household!=="single") {
    let noteContent = `<strong>Household adjustments applied:</strong> Your individual selections have been scaled for a <strong>${esc(householdLabel().toLowerCase())}</strong> household.`;
    if (sp) noteContent += ` Spouse adds: +60% transportation, +50% food/vacation, +100% healthcare/clothing/personal care/therapy, +75% fitness, +30% lifestyle/gifts, +25% tech.`;
    if (nc>0) noteContent += ` Each of ${nc} dependent(s) adds $300 food, $250 healthcare, $100 clothing, $50 personal care, $50 tech/mo.`;
    noteContent += ` Filing: <strong>${f==="mfj"?"Married Filing Jointly":"Single"}</strong>.`;
    html += noteHtml(noteContent, "blue");
  }

  // Tax table
  html += `<div style="border:1px solid ${C.border};border-radius:12px;overflow:hidden;margin-bottom:18px">`;
  html += `<div style="background:${C.navy};padding:12px 20px;display:flex;align-items:center;gap:8px"><div style="width:8px;height:8px;border-radius:50%;background:${C.gold}"></div><span style="font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.8)">Tax & Obligations Breakdown</span></div>`;
  const taxRows = [
    {label:`Federal Income Tax (${f==="mfj"?"MFJ":"Single"})`,val:r.fedTax,note:`${pct(r.fedTax,r.gross)} effective \u00B7 2026 brackets`},
    {label:`${form.retireState} State Tax`,val:r.stateTax,note:`${pct(r.stateTax,r.gross)} effective`},
    form.retireCity?{label:`${form.retireCity} City Tax`,val:r.cityTax,note:`${pct(r.cityTax,r.gross)} effective`}:null,
    r.cPct>0?{label:`Charitable Giving (${(r.cPct*100).toFixed(0)}%)`,val:r.charity,note:"Giving back"}:null,
    {label:"Available for Living Expenses",val:r.takeHome,note:`${fmt(r.takeHome/12)}/month`,bold:true,hi:true},
  ].filter(Boolean);
  taxRows.forEach((row,i)=>{
    html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:13px 20px;${i>0?`border-top:1px solid ${C.border};`:''}background:${row.hi?C.navyPale:C.white}"><div><div style="font-size:13px;font-weight:${row.bold?600:400};color:${row.hi?C.navy:C.ink}">${esc(row.label)}</div><div style="font-size:11px;color:${C.faint}">${esc(row.note)}</div></div><div style="font-size:15px;font-weight:${row.bold?700:500};color:${row.hi?C.navy:C.sub};white-space:nowrap">${fmt(row.val)}<span style="font-size:11px;font-weight:400;color:${C.muted}">/yr</span></div></div>`;
  });
  html += '</div>';

  // Expense breakdown
  html += `<div style="border:1px solid ${C.border};border-radius:12px;overflow:hidden;margin-bottom:18px">`;
  html += `<div style="background:${C.navy};padding:12px 20px;display:flex;align-items:center;gap:8px"><div style="width:8px;height:8px;border-radius:50%;background:${C.gold}"></div><span style="font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.8)">Monthly Expense Breakdown${form.household!=="single"?" (Household Total)":""}</span></div>`;
  html += '<div style="padding:18px 20px">';
  cats.forEach(item=>{
    const p = totalMo>0?item.v/totalMo*100:0;
    html += `<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span style="font-weight:500;color:${C.ink}">${esc(item.l)}</span><span style="font-weight:600;color:${item.color}">${fmt(item.v)}<span style="font-weight:400;color:${C.muted}">/mo</span></span></div><div style="height:7px;background:${C.bg};border-radius:4px;overflow:hidden"><div style="height:100%;width:${p}%;background:${item.color};border-radius:4px;transition:width .5s ease"></div></div></div>`;
  });
  html += `<div style="border-top:2px solid ${C.navy};padding-top:12px;margin-top:6px;display:flex;justify-content:space-between;font-weight:700;font-size:14px;color:${C.navy}"><span>Total Monthly Expenses</span><span>${fmt(totalMo)}/mo</span></div>`;
  html += '</div></div>';

  if (r.stateTax===0) html += noteHtml(`<strong>${esc(form.retireState)}</strong> has no state income tax.`, "green");
  if (form.retireCity) html += noteHtml(`<strong>${esc(form.retireCity)}</strong> adds <strong>${fmt(r.cityTax)}/yr</strong> in city income tax.`, "amber");

  html += `<div style="display:flex;gap:12px;margin-top:6px"><button data-action="back" style="background:transparent;border:2px solid ${C.border};color:${C.sub};border-radius:8px;padding:11px 24px;font-size:13px;font-weight:600;cursor:pointer">\u2190 Back</button><button data-action="startover" style="background:transparent;border:2px solid ${C.border};color:${C.sub};border-radius:8px;padding:11px 24px;font-size:13px;font-weight:600;cursor:pointer">\u21BA Start Over</button></div>`;
  return html;
}

// ── Main Render ──
function render() {
  const canNext = step===2?!!form.retireState:true;

  // Header
  let headerDots = '';
  STEP_NAMES.forEach((s,i)=>{
    headerDots += `<div style="flex:1;text-align:center"><div style="height:3px;background:${i<step?C.gold:i===step?'rgba(245,184,0,.6)':'rgba(255,255,255,.15)'};transition:background .3s"></div><div style="padding:5px 2px 6px;font-size:8px;font-weight:${i===step?700:400};color:${i===step?C.gold:i<step?'rgba(255,255,255,.6)':'rgba(255,255,255,.3)'};overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${i<step?'\u2713':i===step?s.toUpperCase():'\u00B7'}</div></div>`;
  });

  let html = `<div style="background:linear-gradient(135deg,${C.navyDk} 0%,${C.navy} 55%,${C.navyMd} 100%);box-shadow:0 3px 20px rgba(20,31,82,.3)"><div style="max-width:760px;margin:0 auto;padding:20px 28px 0"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px"><div><div style="font-size:10px;font-weight:600;letter-spacing:2.5px;color:rgba(255,255,255,.5);text-transform:uppercase;margin-bottom:5px">UNIV 154 \u00B7 Financial Literacy for Life</div><div style="font-size:22px;font-weight:700;color:${C.white};letter-spacing:-.3px">Retirement Income Planner</div></div><div style="text-align:right;padding-top:2px"><div style="font-size:11px;color:rgba(255,255,255,.4);margin-bottom:3px">Step ${step+1} of ${STEP_NAMES.length}</div><div style="font-size:13px;font-weight:600;color:rgba(255,255,255,.85)">${esc(STEP_NAMES[step])}</div></div></div><div style="display:flex;gap:0">${headerDots}</div></div></div>`;

  // Card
  html += `<div style="max-width:760px;margin:28px auto 40px;padding:0 16px"><div style="background:${C.white};border-radius:16px;border:1px solid ${C.border};box-shadow:0 4px 28px rgba(28,45,110,.09);overflow:hidden"><div style="height:5px;background:linear-gradient(90deg,${C.navyDk},${C.navyMd} 60%,${C.gold})"></div><div style="padding:34px 42px">`;

  // Step content
  const stepRenderers = [renderStep0,renderStep1,renderStep2,renderStep3,renderStep4,renderStep5,renderStep6,renderStep7,renderStep8,renderStep9,renderStep10,renderStep11,renderStep12,renderResults];
  html += stepRenderers[step]();

  // Navigation (not on results)
  if (step < RESULTS_STEP) {
    html += `<div style="display:flex;justify-content:space-between;margin-top:34px;padding-top:22px;border-top:1px solid ${C.border}">`;
    if (step>0) {
      html += `<button data-action="back" style="background:transparent;border:2px solid ${C.border};color:${C.sub};border-radius:8px;padding:11px 24px;font-size:13px;font-weight:600;cursor:pointer">\u2190 Back</button>`;
    } else {
      html += '<div></div>';
    }
    html += `<button data-action="next" ${canNext?'':`disabled`} style="background:${canNext?`linear-gradient(135deg,${C.navyDk},${C.navyMd})`:C.border};color:${canNext?C.white:C.faint};border:none;border-radius:8px;padding:12px 32px;font-size:14px;font-weight:700;cursor:${canNext?'pointer':'not-allowed'};box-shadow:${canNext?'0 4px 16px rgba(28,45,110,.28)':'none'};transition:all .2s">${step===LAST_INPUT?'See My Results \u2192':'Continue \u2192'}</button>`;
    html += '</div>';
  }

  html += '</div></div>';
  html += `<div style="text-align:center;margin-top:14px;font-size:11px;color:${C.faint}">UNIV 154 \u00B7 For educational planning purposes only \u00B7 2026 tax data via Tax Foundation</div></div>`;

  document.getElementById('app').innerHTML = html;
  attachEvents();
}

// ── Event Handling ──
function attachEvents() {
  // Input/select change events
  document.querySelectorAll('[data-field]').forEach(el => {
    const field = el.dataset.field;
    const handler = (e) => {
      const oldVal = form[field];
      form[field] = e.target.value;
      // If state changed, clear city and reapply defaults
      if (field === 'retireState') {
        form.retireCity = '';
        if (form.retireState) applyTierDefaults();
        render();
      } else if (field === 'retireCity') {
        if (form.retireState) applyTierDefaults();
        render();
      } else {
        // Don't re-render for simple input typing, just update state
        // But for selects, re-render
        if (el.tagName === 'SELECT') render();
      }
    };
    if (el.tagName === 'SELECT') {
      el.addEventListener('change', handler);
    } else {
      el.addEventListener('input', handler);
    }
    // Focus/blur styling for inputs
    el.addEventListener('focus', () => { el.style.borderColor = C.navyMd; el.style.background = '#FAFBFF'; });
    el.addEventListener('blur', () => { el.style.borderColor = C.border; el.style.background = C.white; });
  });

  // Tier button clicks
  document.querySelectorAll('[data-tier]').forEach(el => {
    el.addEventListener('click', () => {
      const field = el.dataset.tierfield;
      let val = el.dataset.tier;
      // numDependents is a number
      if (field === 'numDependents') val = parseInt(val);
      form[field] = val;
      // Apply tier defaults for tier changes that affect amounts
      const tierAmtFields = ['housingTier','housingType','mortgagePaidOff','homeCareTier','carTier','carType','foodTier','fitnessTier','therapyTier','lifestyleTier','vacationTier','streamTier','giftsTier','clothingTier','personalCareTier','petsTier'];
      if (tierAmtFields.includes(field)) {
        // Update the corresponding amount
        const mults = getMultipliers(form.retireState, form.retireCity);
        if (field==='housingTier'||field==='housingType'||field==='mortgagePaidOff') {
          const base = getHousingBase(form.housingTier, form.housingType, form.mortgagePaidOff);
          form.housingAmt = base>0?r5(base*mults.housing):0;
        }
        if (field==='homeCareTier') form.homeCareAmt = TIERS.homeCare[form.homeCareTier]?.base??0;
        if (field==='carTier'||field==='carType') { const ct=getCarTiers(); form.carAmt = ct[form.carTier]?.base??0; }
        if (field==='foodTier') form.foodAmt = r5((TIERS.food[form.foodTier]?.base||0)*mults.general);
        if (field==='fitnessTier') form.fitnessAmt = r5((TIERS.fitness[form.fitnessTier]?.base||0)*mults.general);
        if (field==='therapyTier') form.therapyAmt = TIERS.therapy[form.therapyTier]?.base??0;
        if (field==='lifestyleTier') form.lifestyleAmt = r5((TIERS.lifestyle[form.lifestyleTier]?.base||0)*mults.general);
        if (field==='vacationTier') form.vacationAmt = TIERS.vacation[form.vacationTier]?.base??0;
        if (field==='streamTier') form.streamAmt = TIERS.streaming[form.streamTier]?.base??0;
        if (field==='giftsTier') form.giftsAmt = TIERS.gifts[form.giftsTier]?.base??0;
        if (field==='clothingTier') form.clothingAmt = r5((TIERS.clothing[form.clothingTier]?.base||0)*mults.general);
        if (field==='personalCareTier') form.personalCareAmt = r5((TIERS.personalCare[form.personalCareTier]?.base||0)*mults.general);
        if (field==='petsTier') form.petsAmt = TIERS.pets[form.petsTier]?.base??0;
      }
      render();
    });
  });

  // Nav buttons
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', () => {
      const action = el.dataset.action;
      if (action === 'next') { step++; render(); window.scrollTo(0,0); }
      else if (action === 'back') { step--; render(); window.scrollTo(0,0); }
      else if (action === 'startover') { form = getInitialForm(); step = 0; render(); window.scrollTo(0,0); }
    });
  });
}

// ── Boot ──
render();
</script>
</body>
</html>
